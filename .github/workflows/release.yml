name: Publish Skill ZIPs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new v* release tag"
        required: true
        default: "v2026.09.16-r5"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and adapters
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python -m unittest discover -s platforms/workbuddy/soil-city-county-chronicle/scripts -p "test_*.py"
          python tools/validate_adapters.py
      - name: Build deterministic release packages
        run: |
          python tools/build_release_archive.py canonical --output dist/soil-city-county-chronicle-skill.zip
          python tools/build_release_archive.py workbuddy --output dist/soil-city-county-chronicle-workbuddy.zip
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/soil-city-county-chronicle-skill.zip \
              dist/soil-city-county-chronicle-workbuddy.zip \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/soil-city-county-chronicle-skill.zip \
              dist/soil-city-county-chronicle-workbuddy.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
