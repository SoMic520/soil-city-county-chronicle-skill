name: Publish Skill ZIPs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source and adapters
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python -m unittest discover -s platforms/workbuddy/soil-city-county-chronicle/scripts -p "test_*.py"
          python tools/validate_adapters.py
      - name: Build deterministic release packages
        run: |
          python tools/build_release_archive.py canonical --output dist/soil-city-county-chronicle-skill.zip
          python tools/build_release_archive.py workbuddy --output dist/soil-city-county-chronicle-workbuddy.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/soil-city-county-chronicle-skill.zip \
            dist/soil-city-county-chronicle-workbuddy.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
