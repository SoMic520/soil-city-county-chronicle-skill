<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">市级与县级土壤志差异</title>
  <desc id="desc">对比市级和县级土壤志的成果来源、空间重点、第三章主线、配套成果和建议尺度</desc>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="#FFFFFF" stroke="#C9DCD2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <path d="M18 18h1164v56H18z" fill="#2E6B4E"/>
    <path d="M18 74h1164v74H18zM18 222h1164v74H18zM18 370h1164v74H18z" fill="#F7FAF8"/>
    <path d="M18 148h1164v74H18zM18 296h1164v74H18z" fill="#FFFFFF"/>
    <g stroke="#C9DCD2"><path d="M218 18v426M700 18v426"/><path d="M18 74h1164M18 148h1164M18 222h1164M18 296h1164M18 370h1164M18 444h1164"/></g>
    <g fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle"><text x="118" y="53">比较项</text><text x="459" y="53">市级土壤志</text><text x="941" y="53">县级土壤志</text></g>
    <g fill="#263A31" font-size="17">
      <g font-weight="700"><text x="44" y="118">成果来源</text><text x="44" y="192">空间重点</text><text x="44" y="266">第三章主线</text><text x="44" y="340">配套成果</text><text x="44" y="414">建议尺度</text></g>
      <g fill="#52645C">
        <text x="244" y="118">核验并汇总所辖县级成果，处理跨界一致性</text><text x="726" y="118">以本级调查、检测、制图、评价和历史资料为主</text>
        <text x="244" y="192">县际差异、接边、制图综合、市域分区</text><text x="726" y="192">县域内部土壤分布、利用与剖面证据</text>
        <text x="244" y="266">土类 → 亚类 → 土属，土属层面综合记述</text><text x="726" y="266">亚类 → 土属 → 土种，土种含典型剖面详述</text>
        <text x="244" y="340">市级土种志通常独立成册，避免在土壤志重复展开</text><text x="726" y="340">土壤志内按导引逐土种覆盖并给出剖面依据</text>
        <text x="244" y="414">跨县布局、区域协同、全市农业发展与分区治理</text><text x="726" y="414">县域耕地保护、具体障碍改良与落地措施</text>
      </g>
    </g>
  </g>
</svg>
