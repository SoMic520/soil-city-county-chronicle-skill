<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">市县级土壤志八步工作流</title>
  <desc id="desc">从资料接收到终稿归档的八个阶段，分为资料准备、证据编纂和规范交付三类</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18332A" flood-opacity="0.11"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7E948B"/></marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="#F8FBF9" stroke="#DCE8E2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="54" y="54" font-size="25" font-weight="700" fill="#183E31">从“已有报告”到“可验收志稿”</text>
    <text x="54" y="82" font-size="15" fill="#5D746B">八个阶段逐级锁定：来源、证据、篇幅、内容、格式与最终页面</text>
    <g font-size="13" font-weight="600">
      <rect x="868" y="39" width="84" height="28" rx="14" fill="#FFF0D7"/><text x="885" y="58" fill="#7A4A13">资料准备</text>
      <rect x="960" y="39" width="84" height="28" rx="14" fill="#DFF1E8"/><text x="977" y="58" fill="#225D45">证据编纂</text>
      <rect x="1052" y="39" width="84" height="28" rx="14" fill="#E6EEFB"/><text x="1069" y="58" fill="#305783">规范交付</text>
    </g>
    <g fill="none" stroke="#7E948B" stroke-width="2.2" marker-end="url(#arrow)">
      <path d="M292 175H330"/><path d="M573 175H611"/><path d="M854 175H892"/><path d="M1014 233V263"/><path d="M892 347H854"/><path d="M611 347H573"/><path d="M330 347H292"/>
    </g>
    <g filter="url(#cardShadow)">
      <g transform="translate(49 112)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#E7C990"/><circle cx="34" cy="32" r="20" fill="#FFF0D7"/><text x="27" y="39" font-size="20" font-weight="700" fill="#8A5517">1</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">资料接收</text><text x="65" y="55" font-size="13" fill="#7B6B54">总体、专项与地方资料</text><text x="24" y="91" font-size="14" fill="#52645C">建立文件清单，不凭文件名推定内容</text></g>
      <g transform="translate(330 112)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#E7C990"/><circle cx="34" cy="32" r="20" fill="#FFF0D7"/><text x="27" y="39" font-size="20" font-weight="700" fill="#8A5517">2</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">层级与版本核验</text><text x="65" y="55" font-size="13" fill="#7B6B54">市级/县级、来源、时期、口径</text><text x="24" y="91" font-size="14" fill="#52645C">先确认适用导引，再识别冲突与缺件</text></g>
      <g transform="translate(611 112)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#9FCBB6"/><circle cx="34" cy="32" r="20" fill="#DFF1E8"/><text x="27" y="39" font-size="20" font-weight="700" fill="#2C6B50">3</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">证据建链</text><text x="65" y="55" font-size="13" fill="#61786D">主张—来源—指标—表图</text><text x="24" y="91" font-size="14" fill="#52645C">每项关键结论均可定位、可追溯</text></g>
      <g transform="translate(892 112)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#9FCBB6"/><circle cx="34" cy="32" r="20" fill="#DFF1E8"/><text x="27" y="39" font-size="20" font-weight="700" fill="#2C6B50">4</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">篇幅签约</text><text x="65" y="55" font-size="13" fill="#61786D">同层级模板、结构折算</text><text x="24" y="91" font-size="14" fill="#52645C">先定章目标，再按偏差门槛验收</text></g>
      <g transform="translate(892 286)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#9FCBB6"/><circle cx="34" cy="32" r="20" fill="#DFF1E8"/><text x="27" y="39" font-size="20" font-weight="700" fill="#2C6B50">5</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">章节编纂</text><text x="65" y="55" font-size="13" fill="#61786D">章节契约、逐土种覆盖</text><text x="24" y="91" font-size="14" fill="#52645C">专题按适用性处理，缺证不臆写</text></g>
      <g transform="translate(611 286)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#9FCBB6"/><circle cx="34" cy="32" r="20" fill="#DFF1E8"/><text x="27" y="39" font-size="20" font-weight="700" fill="#2C6B50">6</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">交叉复核</text><text x="65" y="55" font-size="13" fill="#61786D">数值、表图、历史可比</text><text x="24" y="91" font-size="14" fill="#52645C">核对单位、分母、时期与空间口径</text></g>
      <g transform="translate(330 286)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#AFC6E4"/><circle cx="34" cy="32" r="20" fill="#E6EEFB"/><text x="27" y="39" font-size="20" font-weight="700" fill="#3B6693">7</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">规范排版</text><text x="65" y="55" font-size="13" fill="#63768D">标题层级、表图、页眉页脚</text><text x="24" y="91" font-size="14" fill="#52645C">执行已确认的验收导引与模板规范</text></g>
      <g transform="translate(49 286)"><rect width="243" height="121" rx="16" fill="#FFFFFF" stroke="#AFC6E4"/><circle cx="34" cy="32" r="20" fill="#E6EEFB"/><text x="27" y="39" font-size="20" font-weight="700" fill="#3B6693">8</text><text x="65" y="31" font-size="17" font-weight="700" fill="#2F3F38">终稿归档</text><text x="65" y="55" font-size="13" fill="#63768D">结构检查、全页渲染</text><text x="24" y="91" font-size="14" fill="#52645C">留存日志、版本、依据与验收结果</text></g>
    </g>
  </g>
</svg>
